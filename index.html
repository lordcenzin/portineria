<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portineria Smart v3</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 15px; margin: 0; background: #f4f4f9; color: #333; padding-bottom: 50px; }
    h2, h3 { margin-top: 0; color: #111; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
    
    /* Contenitore Fotocamera SEMPLICE (senza mirino, analizziamo tutto il frame) */
    .camera-box { position: relative; width: 100%; border-radius: 8px; background: #000; overflow: hidden; }
    video { width: 100%; height: auto; display: block; }

    button { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: background 0.2s; }
    button.secondary { background: #007bff; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button:active { opacity: 0.8; }
    
    input { width: 100%; padding: 12px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    .status-msg { font-size: 14px; color: #666; margin-top: 10px; font-style: italic; min-height: 1em; text-align: center; }
    
    /* Box Esito */
    #actionCard { border: 3px solid #25D366; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
  </style>
</head>
<body>

  <h2>📦 Portineria Smart <span style="font-size:12px; color:#666;">(v3 Nativa)</span></h2>

  <!-- SEZIONE FOTOCAMERA -->
  <div class="card">
    <h3>1. Inquadra la Busta</h3>
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <button id="btnScan" onclick="catturaELeggiNativo()">📷 Leggi Destinatario</button>
    <div id="status" class="status-msg">Inizializzazione fotocamera...</div>
  </div>

  <!-- SEZIONE ESITO / WHATSAPP -->
  <div class="card" id="actionCard" style="display:none;">
    <h3 style="color: #25D366; text-align:center;">✅ CONDOMINO TROVATO!</h3>
    <p style="font-size: 22px; text-align:center; margin: 10px 0;"><strong><span id="matchedName">-</span></strong></p>
    <p style="font-size: 16px; color: #555; text-align:center; margin: 5px 0;">Interno: <span id="matchedInterno">-</span></p>
    <button onclick="inviaWhatsApp()">💬 Apri WhatsApp e Avvisa</button>
  </div>

  <!-- RUBRICA -->
  <div class="card">
    <h3>📖 Rubrica Veloci (Cognome Nome)</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="cognome" placeholder="Cognome">
      <input type="text" id="nome" placeholder="Nome">
    </div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="interno" placeholder="Int. (es. 4B)" style="width:40%;">
      <input type="tel" id="telefono" placeholder="393331234567" style="width:60%;">
    </div>
    <button class="secondary" onclick="salvaCondomino()">➕ Salva in Rubrica</button>
    <div id="rubricaList" style="margin-top: 15px; font-size: 14px;"></div>
  </div>

  <!-- Canvas nascosto per l'elaborazione dell'immagine -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let rubrica = JSON.parse(localStorage.getItem('rubrica_condomini')) || [];
    let selectedCondomino = null;
    let textDetector = null;

    // Controllo compatibilità API Nativa
    async function checkCompatibility() {
      if ('TextDetector' in window) {
        textDetector = new TextDetector();
        document.getElementById('status').innerText = "🟢 Sistema Nativo Pronto. Inquadra e premi 'Leggi'.";
      } else {
        document.getElementById('status').innerHTML = "❌ <strong style='color:red;'>Errore: Browser non compatibile.</strong><br>L'app funziona solo su Android (Chrome/Edge). Safari (iPhone) NON è supportato.";
        document.getElementById('btnScan').disabled = true;
        document.getElementById('btnScan').style.background = "#ccc";
      }
    }

    // Inizializza la fotocamera alla massima risoluzione possibile
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
        });
        document.getElementById('video').srcObject = stream;
      } catch (err) {
        document.getElementById('status').innerText = "❌ Errore fotocamera: consenti i permessi.";
      }
    }

    // --- NUOVA LETTURA CON API NATIVA (TextDetector) ---
    async function catturaELeggiNativo() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      const btnScan = document.getElementById('btnScan');
      const actionCard = document.getElementById('actionCard');

      if (!video.videoWidth || !textDetector) return;

      btnScan.disabled = true;
      actionCard.style.display = 'none';
      status.innerText = "🔍 Analisi nativa in corso...";

      // Cattura l'intero frame video
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      try {
        // Rileva testo direttamente dall'elemento canvas
        const detectedTexts = await textDetector.detect(canvas);
        
        if (detectedTexts.length === 0) {
          status.innerText = "❓ Nessun testo rilevato. Prova ad avvicinarti o a migliorare la luce.";
          btnScan.disabled = false;
          return;
        }

        // Unisce tutto il testo rilevato in un'unica stringa
        let tuttoIlTesto = detectedTexts.map(t => t.rawValue).join(' ');
        console.log("Testo Nativo Rilevato:", tuttoIlTesto);

        cercaInRubrica(tuttoIlTesto);

      } catch (err) {
        console.error("Errore TextDetector:", err);
        status.innerText = "❌ Errore durante l'analisi nativa.";
      } finally {
        btnScan.disabled = false;
      }
    }

    // Ricerca Flessibile (Cognome Nome / Solo Cognome)
    function cercaInRubrica(testoLetto) {
      const status = document.getElementById('status');
      const testoClean = testoLetto.toLowerCase().replace(/[^a-z0-9àèéìòù ]/g, " ");

      selectedCondomino = null;

      for (let c of rubrica) {
        const cognome = c.cognome.toLowerCase().trim();
        const nome = c.nome.toLowerCase().trim();

        // Combinazioni possibili
        const cognomeNome = `${cognome} ${nome}`;
        const nomeCognome = `${nome} ${cognome}`;

        // Verifica se il testo letto contiene Nome+Cognome, Cognome+Nome o almeno il Cognome
        if (testoClean.includes(cognomeNome) || testoClean.includes(nomeCognome) || (cognome.length > 2 && testoClean.includes(cognome))) {
          selectedCondomino = c;
          break;
        }
      }

      if (selectedCondomino) {
        status.innerText = "🟢 Lettura completata.";
        document.getElementById('matchedName').innerText = `${selectedCondomino.cognome.toUpperCase()} ${selectedCondomino.nome}`;
        document.getElementById('matchedInterno').innerText = selectedCondomino.interno;
        document.getElementById('actionCard').style.display = 'block';
        
        // Scorri automaticamente verso la card del risultato
        document.getElementById('actionCard').scrollIntoView({ behavior: 'smooth' });
      } else {
        status.innerText = "❓ Destinatario non riconosciuto in rubrica. Riprova scansionando solo il nome.";
      }
    }

    // Gestione Rubrica
    function salvaCondomino() {
      const cognome = document.getElementById('cognome').value.trim();
      const nome = document.getElementById('nome').value.trim();
      const interno = document.getElementById('interno').value.trim();
      let telefono = document.getElementById('telefono').value.trim().replace(/\s+/g, '');

      if (!cognome || !telefono) return alert("Inserisci almeno Cognome e Telefono!");
      
      if (!telefono.startsWith('+') && !telefono.startsWith('39')) {
        telefono = '39' + telefono;
      }
      telefono = telefono.replace('+', '');

      rubrica.push({ cognome, nome, interno, telefono });
      localStorage.setItem('rubrica_condomini', JSON.stringify(rubrica));
      
      document.getElementById('cognome').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('interno').value = '';
      document.getElementById('telefono').value = '';
      mostraRubrica();
    }

    function eliminaCondomino(index) {
      if(confirm("Eliminare questo condomino?")) {
        rubrica.splice(index, 1);
        localStorage.setItem('rubrica_condomini', JSON.stringify(rubrica));
        mostraRubrica();
      }
    }

    function mostraRubrica() {
      const list = document.getElementById('rubricaList');
      if (rubrica.length === 0) {
        list.innerHTML = "<i>Nessun condomino salvato.</i>";
        return;
      }
      list.innerHTML = '<b>Rubrica (' + rubrica.length + '):</b><br>' + 
        rubrica.map((c, i) => `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px; padding: 6px 0; border-bottom: 1px solid #eee;">
            <span>• <b>${c.cognome.toUpperCase()} ${c.nome}</b> (${c.interno})</span>
            <button onclick="eliminaCondomino(${i})" style="width:auto; padding:4px 10px; margin:0; background:#dc3545; font-size:12px; font-weight:normal;">Elimina</button>
          </div>
        `).join('');
    }

    function inviaWhatsApp() {
      if (!selectedCondomino) return;
      const testoMsg = `Gentile ${selectedCondomino.cognome.toUpperCase()} ${selectedCondomino.nome}, le comunichiamo che è arrivata della corrispondenza/pacco per lei in portineria (${selectedCondomino.interno}).`;
      const url = `https://wa.me/${selectedCondomino.telefono}?text=${encodeURIComponent(testoMsg)}`;
      window.open(url, '_blank');
    }

    // Avvio
    window.onload = () => {
      checkCompatibility();
      initCamera();
      mostraRubrica();
    };
  </script>
</body>
</html>
